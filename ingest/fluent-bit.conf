[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name   tcp
    Listen 0.0.0.0
    Port   5140
    Format none

[FILTER]
    Name   modify
    Match  *
    Add    source syslog

[OUTPUT]
    Name  http
    Match *
    Host  backend
    Port  8000
    URI   /ingest/syslog
    Format json
    Header Content-Type application/json
    Header X-Ingest-Token supersecretingestkey